name: E2E Tests

on:
  schedule:
    - cron: "0 0 * * *"  # every day at midnight (00:00 UTC)
      
env:
  AUTH_API_BACKEND_BASE_URL: ${{ secrets.AUTH_API_BACKEND_BASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
      
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm install -g pnpm && pnpm install

    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps

    - name: Run Playwright tests
      run: pnpm exec playwright test --config src/shared/test/playwright.config.ts

    - name: Run Playwright accessibility tests
      run: pnpm exec playwright test --config src/shared/test/playwright.accessibility.config.ts

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
